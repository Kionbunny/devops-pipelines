name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build project
      run: |
        if [ -f package.json ] && jq -e '.scripts.build' package.json > /dev/null; then
          npm run build
        else
          echo "No build script defined, skipping build."
        fi

    - name: Deploy (example step)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: echo "Add your deployment script here."
